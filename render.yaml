# Render Blueprint for labb.com (Next.js). Runs as a Node web service so the lead API,
# gated pages and Stripe webhook work. Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: labb-com
    runtime: node
    plan: starter
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_NOINDEX
        value: "true"
      - key: LEAD_TO_EMAIL
        value: kelly.ramsey@labb.com
      - key: LEAD_FROM_EMAIL
        value: Labb Website <leads@labb.com>
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: labb-com-db
          property: connectionString
      - key: MAIL_FROM
        value: Labb <info@labb.com>
      - key: CPP_LEAD_TO_EMAIL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

databases:
  - name: labb-com-db
    databaseName: labb
    user: labb
    plan: basic-256mb
    region: virginia
    ipAllowList: []
